name: Bug report
description: Report a reproducible Recall problem using redacted or synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not upload personal backups, private notes,
        textbook pages, credentials or unredacted logs. Report vulnerabilities
        privately through Security → Advisories → Report a vulnerability.
  - type: input
    id: version
    attributes:
      label: Recall version or commit
      description: Include the release tag and whether you use preview or debug.
      placeholder: "1.0.0-preview.2, optimized preview"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device
      placeholder: "Android 14, emulator or device model"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give a minimal sequence and say whether it happens consistently.
      placeholder: "1. Open a lesson…\n2. Reveal an answer…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error if available, without private data.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant settings and evidence
      description: |
        UI: language, theme, font scale. Reminders: permissions, battery restrictions,
        quiet times, windows and pauses. Imports: minimal synthetic JSON and error.
        Attach only redacted screenshots/logs. Do not clear storage to reproduce.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report of this problem.
          required: true
        - label: My report contains no personal backups, private materials or secrets.
          required: true
